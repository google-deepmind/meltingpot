# A workflow to publish releases to PyPi and TestPyPi.

name: pypi-publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Melting Pot
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Show Python setup
        run: |
          python --version
          pip list
      - name: Build distribution
        run: |
          python setup.py sdist
          # Workaround old setuptools not normalizing name in sdist.
          for OLD in ./dist/dm-meltingpot-*; do
             NEW="$(echo "$OLD" | sed s/dm-meltingpot/dm_meltingpot/)"
             mv "$OLD" "$NEW"
          done
          ls dist/*
      - name: Save artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: dist
          path: ./dist
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ${{ matrix.os }}
    env:
      SYSTEM_VERSION_COMPAT: 0  # See https://github.com/actions/setup-python/issues/279.
    timeout-minutes: 180
    strategy:
      fail-fast: ${{ github.event_name == 'release' }}
      matrix:
        os:
          - macos-15
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: Load artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: dist
          path: ./dist
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools
      - name: Install source distribution
        run: |
          pip install dist/*.tar.gz
          pip list
          pip check
      - name: Test source distribution
        run: |
          pip install pytest-xdist
          pytest -n auto --pyargs meltingpot

  publish:
    name: Publish
    needs: [build, test]
    if: always() && needs.build.result == 'success' && needs.test.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dm-meltingpot
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Load artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: dist
          path: ./dist
      - name: Publish to TestPyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: false
          repository-url: https://test.pypi.org/legacy/
          verbose: true
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        if: github.event_name == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        if: github.event_name == 'release'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up failed staging attempt for this exact version (if any)
        if: github.event_name == 'release'
        id: exit_gate_cleanup
        run: |
          set -euo pipefail
          PKG_VER=$(python3 - <<'PY'
          import email, glob, tarfile, zipfile
          files = sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True))
          assert files, "No distributions found in dist/"
          f = files[0]
          if f.endswith(".whl"):
            with zipfile.ZipFile(f) as zf:
              meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
              raw = zf.read(meta).decode()
          else:
            with tarfile.open(f) as tf:
              info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
              raw = tf.extractfile(info).read().decode()
          print(email.message_from_string(raw)["Version"].strip())
          PY
          )
          echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
          if gcloud artifacts versions describe "${PKG_VER}" \
            --package="dm-meltingpot" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="meltingpot--pypi" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${PKG_VER}" \
              --package="dm-meltingpot" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="meltingpot--pypi" \
              --quiet
          fi
      - name: Stage distributions to OSS Exit Gate and upload manifest
        if: github.event_name == 'release'
        env:
          PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          DIST_FILES=(dist/**/*.whl dist/**/*.tar.gz)
          python3 -m pip install --upgrade twine
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          python3 -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/meltingpot--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            "${DIST_FILES[@]}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "dm-meltingpot",
                    "version": "${PKG_VER}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/meltingpot/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
